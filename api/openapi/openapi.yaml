                  - notMarked
                  - pendingApproval
                  - presentPct
              pendingApprovals:
                type: object
                properties:
                  attendance:
                    type: integer
                  corrections:
                    type: integer
                  leave:
                    type: integer
                  allowances:
                    type: integer
                required:
                  - attendance
                  - corrections
                  - leave
                  - allowances
                description: Pending in this BU within what you can see
              allowancesThisMonth:
                type: object
                properties:
                  requestedPaise:
                    type: integer
                  approvedPaise:
                    type: integer
                required:
                  - requestedPaise
                  - approvedPaise
              tasksToday:
                type: array
                items:
                  type: object
                  properties:
                    om:
                      $ref: "#/components/schemas/PersonRef"
                    total:
                      type: integer
                    completed:
                      type: integer
                    notDone:
                      type: integer
                    pending:
                      type: integer
                  required:
                    - om
                    - total
                    - completed
                    - notDone
                    - pending
            required:
              - businessUnit
              - today
              - pendingApprovals
              - allowancesThisMonth
              - tasksToday
        me:
          type: object
          properties:
            pendingApprovals:
              type: object
              properties:
                attendance:
                  type: integer
                corrections:
                  type: integer
                leave:
                  type: integer
                allowances:
                  type: integer
              required:
                - attendance
                - corrections
                - leave
                - allowances
              description: Waiting for my decision
            tasksOpen:
              type: integer
            tasksOverdue:
              type: integer
            myAttendanceToday:
              type: object
              nullable: true
              properties:
                status:
                  $ref: "#/components/schemas/AttendanceStatus"
                approvalState:
                  $ref: "#/components/schemas/ApprovalState"
              required:
                - status
                - approvalState
            unreadNotifications:
              type: integer
          required:
            - pendingApprovals
            - tasksOpen
            - tasksOverdue
            - myAttendanceToday
            - unreadNotifications
      required:
        - date
        - month
        - businessUnits
        - me
    DutyStatus:
      type: string
      enum:
        - PLANNED
        - CONFIRMED
        - COMPLETED
        - CANCELLED
    AssignmentRole:
      type: string
      enum:
        - DRIVER
        - CO_DRIVER
        - CONDUCTOR
        - HELPER
    RosterWarning:
      type: object
      properties:
        code:
          type: string
          enum:
            - DUTY_HOURS_EXCEEDED
            - MIN_REST_VIOLATED
            - NO_WEEKLY_OFF
            - DOCUMENT_EXPIRING
        message:
          type: string
      required:
        - code
        - message
    RosterEmployee:
      type: object
      properties:
        id:
          type: string
          format: uuid
        empCode:
          type: string
        fullName:
          type: string
        category:
          $ref: "#/components/schemas/EmployeeCategory"
        phone:
          type: string
      required:
        - id
        - empCode
        - fullName
        - category
        - phone
    AssignmentItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        dutyId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/AssignmentRole"
        isSpare:
          type: boolean
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/RosterWarning"
          description: Warnings accepted when the assignment was made
        employee:
          $ref: "#/components/schemas/RosterEmployee"
      required:
        - id
        - dutyId
        - role
        - isSpare
        - warnings
        - employee
    DutyItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        depotId:
          type: string
          format: uuid
        dutyDate:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: 2026-11-09
          description: Calendar date (IST business date)
        status:
          $ref: "#/components/schemas/DutyStatus"
        scheduledStart:
          type: string
          format: date-time
        scheduledEnd:
          type: string
          format: date-time
        startTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: 06:30
        endTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: 06:30
        crossesMidnight:
          type: boolean
        durationMinutes:
          type: integer
        route:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            code:
              type: string
            name:
              type: string
          required:
            - id
            - code
            - name
        vehicle:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            regNo:
              type: string
            type:
              type: string
          required:
            - id
            - regNo
            - type
        template:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
          required:
            - id
            - name
        notes:
          type: string
          nullable: true
        filled:
          type: boolean
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/AssignmentItem"
      required:
        - id
        - depotId
        - dutyDate
        - status
        - scheduledStart
        - scheduledEnd
        - startTime
        - endTime
        - crossesMidnight
        - durationMinutes
        - route
        - vehicle
        - template
        - notes
        - filled
        - assignments
    RosterDay:
      type: object
      properties:
        date:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: 2026-11-09
          description: Calendar date (IST business date)
        depot:
          $ref: "#/components/schemas/DepotSummary"
        summary:
          type: object
          properties:
            duties:
              type: integer
            filled:
              type: integer
            unfilled:
              type: integer
            cancelled:
              type: integer
          required:
            - duties
            - filled
            - unfilled
            - cancelled
        duties:
          type: array
          items:
            $ref: "#/components/schemas/DutyItem"
      required:
        - date
        - depot
        - summary
        - duties
    DutyCreateBody:
      type: object
      properties:
        depotId:
          type: string
          format: uuid
        dutyDate:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: 2026-11-09
          description: Calendar date (IST business date)
        templateId:
          type: string
          format: uuid
          description: Takes times (and the default route) from the template
        startTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: 06:30
        endTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: 06:30
        crossesMidnight:
          type: boolean
        routeId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
        notes:
          type: string
          maxLength: 500
      required:
        - depotId
        - dutyDate
    DutyUpdateBody:
      type: object
      properties:
        startTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: 06:30
        endTime:
          type: string
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          example: 06:30
        crossesMidnight:
          type: boolean
        routeId:
          type: string
          nullable: true
          format: uuid
        vehicleId:
          type: string
          nullable: true
          format: uuid
        status:
          $ref: "#/components/schemas/DutyStatus"
        notes:
          type: string
          nullable: true
          maxLength: 500
    AssignmentCreateBody:
      type: object
      properties:
        employeeId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/AssignmentRole"
        isSpare:
          type: boolean
          default: false
      required:
        - employeeId
        - role
    AssignmentResult:
      type: object
      properties:
        assignment:
          $ref: "#/components/schemas/AssignmentItem"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/RosterWarning"
        duty:
          $ref: "#/components/schemas/DutyItem"
      required:
        - assignment
        - warnings
        - duty
    SpareItem:
      type: object
      properties:
        employee:
          $ref: "#/components/schemas/RosterEmployee"
        designation:
          type: string
          nullable: true
        compliance:
          $ref: "#/components/schemas/ComplianceOverall"
        dutyMinutesLast7Days:
          type: integer
        dutiesOnDate:
          type: integer
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/RosterWarning"
          description: Rule warnings if assigned to dutyId (empty when dutyId is not given)
      required:
        - employee
        - designation
        - compliance
        - dutyMinutesLast7Days
        - dutiesOnDate
        - warnings
    SpareList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SpareItem"
      required:
        - items
    RosterCopyBody:
      type: object
      properties:
        depotId:
          type: string
          format: uuid
        fromDate:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: 2026-11-09
          description: Calendar date (IST business date)
        toDate:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: 2026-11-09
          description: Calendar date (IST business date)
        days:
          type: integer
          minimum: 1
          maximum: 7
          default: 1
          description: 1 = copy a day, 7 = copy a week
        includeAssignments:
          type: boolean
          default: true
      required:
        - depotId
        - fromDate
        - toDate
    RosterCopyResult:
      type: object
      properties:
        createdDuties:
          type: integer
        existingDuties:
          type: integer
          description: Source duties already present on the target day (not copied twice)
        copiedAssignments:
          type: integer
        skipped:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                pattern: ^\d{4}-\d{2}-\d{2}$
                example: 2026-11-09
                description: Calendar date (IST business date)
              employeeId:
                type: string
                format: uuid
              employeeName:
                type: string
              reason:
                type: string
                description: Error code, e.g. DOCUMENT_INVALID, EMPLOYEE_ON_LEAVE, ROSTER_RULE_VIOLATION
            required:
              - date
              - employeeId
              - employeeName
              - reason
      required:
        - createdDuties
        - existingDuties
        - copiedAssignments
        - skipped
    DocumentInvalidDetails:
      type: object
      properties:
        failing:
          type: array
          items:
            $ref: "#/components/schemas/ComplianceItem"
        spares:
          type: array
          items:
            $ref: "#/components/schemas/SpareItem"
      required:
        - failing
        - spares
    SettingItem:
      type: object
      properties:
        key:
          type: string
        description:
          type: string
        value:
          nullable: true
          description: JSON value; its shape depends on the key
        defaultValue:
          nullable: true
        isDefault:
          type: boolean
        editableBy:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        updatedAt:
          type: string
          nullable: true
          format: date-time
      required:
        - key
        - description
        - isDefault
        - editableBy
        - updatedAt
    SettingList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SettingItem"
      required:
        - items
    SettingUpdateBody:
      type: object
      properties:
        value:
          nullable: true
    TaskPriority:
      type: string
      enum:
        - NORMAL
        - HIGH
    TaskStatus:
      type: string
      enum:
        - PENDING
        - COMPLETED
        - NOT_DONE
    TaskItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        date:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: 2026-11-09
          description: Calendar date (IST business date)
        businessUnit:
          $ref: "#/components/schemas/BusinessUnitRef"
        title:
          type: string
        details:
          type: string
          nullable: true
        priority:
          $ref: "#/components/schemas/TaskPriority"
        allottedBy:
          $ref: "#/components/schemas/PersonRef"
        assignee:
          $ref: "#/components/schemas/PersonRef"
        status:
          $ref: "#/components/schemas/TaskStatus"
        overdue:
          type: boolean
          description: Still PENDING after its date (IST)
        reason:
          type: string
          nullable: true
        comment:
          type: string
          nullable: true
        submittedAt:
          type: string
          nullable: true
          format: date-time
        reopenedAt:
          type: string
          nullable: true
          format: date-time
        reopenComment:
          type: string
          nullable: true
        reopenCount:
          type: integer
        canSubmit:
          type: boolean
        canReopen:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - groupId
        - date
        - businessUnit
        - title
        - details
        - priority
        - allottedBy
        - assignee
        - status
        - overdue
        - reason
        - comment
        - submittedAt
        - reopenedAt
        - reopenComment
        - reopenCount
        - canSubmit
        - canReopen
        - createdAt
    TaskPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TaskItem"
        nextCursor:
          type: string
          nullable: true
          format: uuid
      required:
        - items
        - nextCursor
    TaskList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TaskItem"
      required:
        - items
    TaskCreateBody:
      type: object
      properties:
        date:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
          example: 2026-11-09
          description: Default today (IST); future dates allowed
        businessUnitId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 2
          maxLength: 200
        details:
          type: string
          maxLength: 2000
        priority:
          $ref: "#/components/schemas/TaskPriority"
        assigneeEmployeeIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 50
          description: RMs reporting to you in this business unit; one task each
      required:
        - businessUnitId
        - title
        - assigneeEmployeeIds
    TaskSubmitBody:
      type: object
      properties:
        status:
          type: string
          enum:
            - COMPLETED
            - NOT_DONE
        reason:
          type: string
          minLength: 3
          maxLength: 1000
          description: Required for NOT_DONE
        comment:
          type: string
          maxLength: 1000
      required:
        - status
    TaskReopenBody:
      type: object
      properties:
        comment:
          type: string
          minLength: 3
          maxLength: 1000
      required:
        - comment
  parameters: {}
paths:
  /allowance-types:
    get:
      operationId: listAllowanceTypes
      summary: Allowance types
      description: Any authenticated manager.
      tags:
        - Allowances
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Types
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowanceTypeList"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createAllowanceType
      summary: Add an allowance type
      description: "Roles: HR, DIRECTOR."
      tags:
        - Allowances
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllowanceTypeCreateBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowanceTypeItem"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Role not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Code exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /allowance-types/{id}:
    patch:
      operationId: updateAllowanceType
      summary: Change, limit or deactivate an allowance type
      description: "Roles: HR, DIRECTOR."
      tags:
        - Allowances
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllowanceTypeUpdateBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowanceTypeItem"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Role not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /allowances:
    get:
      operationId: listAllowances
      summary: "Allowance requests: mine, my team, waiting for me, or all (HR / director)"
      description: Any authenticated manager.
      tags:
        - Allowances
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
            description: The nextCursor of the previous page
          required: false
          description: The nextCursor of the previous page
          name: cursor
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          required: false
          name: limit
          in: query
        - schema:
            type: string
            enum:
              - mine
              - team
              - approvals
              - all
            default: mine
            description: "mine: raised by me or for me; team: my reports; approvals: waiting for me; all: HR / director"
          required: false
          description: "mine: raised by me or for me; team: my reports; approvals: waiting for me; all: HR / director"
          name: scope
          in: query
        - schema:
            $ref: "#/components/schemas/RequestStatus"
          required: false
          name: status
          in: query
        - schema:
            type: string
            format: uuid
          required: false
          name: businessUnitId
          in: query
        - schema:
            type: string
            format: uuid
          required: false
          name: batchId
          in: query
        - schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            example: 2026-11-09
            description: Calendar date (IST business date)
          required: false
          description: Calendar date (IST business date)
          name: from
          in: query
        - schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
            example: 2026-11-09
            description: Calendar date (IST business date)
          required: false
          description: Calendar date (IST business date)
          name: to
          in: query
      responses:
        "200":
          description: Newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowancePage"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: scope=all needs HR or the director
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createAllowance
      summary: "Raise an allowance (RM: self or team, one request per beneficiary; OM: self)"
      description: |-
        A comment and/or a voice note is required. Upload the voice note / receipt first with POST /uploads/presign.

        Roles: REGIONAL_MANAGER, OPERATIONAL_MANAGER.
      tags:
        - Allowances
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllowanceCreateBody"
      responses:
        "201":
          description: Created requests (same batchId)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowanceList"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Beneficiary not in your team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Type not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: AMOUNT_ABOVE_LIMIT, FILE_NOT_UPLOADED or NO_APPROVER
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /allowances/summary:
    get:
      operationId: allowanceMonthlySummary
      summary: Monthly totals per business unit
      description: "Roles: HR, DIRECTOR."
      tags:
        - Allowances
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            pattern: ^\d{4}-(0[1-9]|1[0-2])$
            example: 2026-11
          required: true
          name: month
          in: query
        - schema:
            type: string
            format: uuid
          required: false
          name: businessUnitId
          in: query
      responses:
        "200":
          description: Totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowanceSummary"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Role not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /allowances/batch/{batchId}/approve:
    post:
      operationId: approveAllowanceBatch
      summary: Approve a whole batch at the requested amounts
      description: "Roles: OPERATIONAL_MANAGER, HR, DIRECTOR."
      tags:
        - Allowances
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: batchId
          in: path
      responses:
        "200":
          description: Approved and skipped ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchApproveResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Role not permitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Nothing to approve
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /allowances/{id}/files:
