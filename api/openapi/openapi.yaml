    post:
      operationId: uploadPayslips
      summary: Bulk upload payslip PDFs for a pay period (payslip-<empCode>.pdf)
      description: |-
        Each file is matched by its employee code; unmatched, invalid and duplicate files are reported and not stored. A re-upload adds a new version.

        Roles: HR.
      tags:
        - Payslips
      security:
        - bearerAuth: []
