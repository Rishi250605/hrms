name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, typecheck, migrations, OpenAPI, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hrms
          POSTGRES_PASSWORD: hrms
          POSTGRES_DB: hrms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hrms -d hrms"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://hrms:hrms@localhost:5432/hrms
      TEST_DATABASE_URL: postgresql://hrms:hrms@localhost:5432/hrms_test
      JWT_ACCESS_SECRET: ci-only-access-secret-0123456789abcdef
      TOKEN_HASH_PEPPER: ci-only-token-pepper-0123456789abcdef
      DATA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Create the integration-test database
        run: PGPASSWORD=hrms psql -h localhost -U hrms -d hrms -c 'CREATE DATABASE hrms_test'
      - name: Apply migrations to a fresh database
        run: npx prisma migrate deploy
      - name: Migrations match schema.prisma
        run: npm run db:check
      - name: OpenAPI spec is up to date
        run: npm run openapi:check
      - name: Seed is runnable
        run: npm run db:seed
        env:
          SEED_ADMIN_PHONE: "+919000000001"
          SEED_DEMO: "true"
      - run: npm test

  mobile:
    name: Mobile (generated client, analyze, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Regenerate API client from openapi.yaml
        run: bash tool/gen_api.sh
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build
      - name: Generated code is committed and up to date
        run: git diff --exit-code -- . ':(exclude)pubspec.lock'
      - run: flutter analyze
      - run: flutter test
