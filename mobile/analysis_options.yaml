include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    # Generated code
    - packages/hrms_api/**
    - lib/**/*.g.dart
    - lib/**/*.freezed.dart
    - lib/app/l10n/app_localizations*.dart
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - cancel_subscriptions
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas: false
    - unawaited_futures
